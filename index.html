<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FASIC — A new era of gaming peripherals. Coming soon." />
  <meta property="og:title" content="FASIC" />
  <meta property="og:description" content="Something is coming." />
  <title>FASIC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;200;300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050505;
      cursor: none;
    }

    /* Custom cursor */
    #cursor {
      position: fixed;
      width: 5px; height: 5px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease, opacity 0.3s ease, background 0.3s ease;
    }
    #cursor.hover {
      transform: translate(-50%, -50%) scale(3);
      background: rgba(255, 255, 255, 0.15);
    }

    /* Canvas */
    #webgl {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Vignette overlay */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at 50% 55%,
        transparent 25%,
        rgba(0, 0, 0, 0.72) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* Top-left corner accent line */
    .corner-line {
      position: fixed;
      top: 48px; left: 48px;
      width: 32px; height: 1px;
      background: rgba(255,255,255,0.15);
      z-index: 10;
      opacity: 0;
      animation: fadeInSlow 1.5s ease 2.5s forwards;
    }
    .corner-line::after {
      content: '';
      position: absolute;
      top: -16px; left: 0;
      width: 1px; height: 32px;
      background: rgba(255,255,255,0.15);
    }

    /* Bottom-right corner accent line */
    .corner-line-br {
      position: fixed;
      bottom: 48px; right: 48px;
      width: 32px; height: 1px;
      background: rgba(255,255,255,0.15);
      z-index: 10;
      opacity: 0;
      animation: fadeInSlow 1.5s ease 2.5s forwards;
    }
    .corner-line-br::after {
      content: '';
      position: absolute;
      bottom: -16px; right: 0;
      width: 1px; height: 32px;
      background: rgba(255,255,255,0.15);
    }

    /* Main text overlay */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .brand {
      font-family: 'Barlow', 'Helvetica Neue', sans-serif;
      font-weight: 100;
      font-size: clamp(68px, 12vw, 158px);
      letter-spacing: 0.52em;
      text-indent: 0.52em;
      color: rgba(255, 255, 255, 0.93);
      user-select: none;
      opacity: 0;
      animation: revealBrand 2s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    .tagline {
      margin-top: 22px;
      font-family: 'Barlow', 'Helvetica Neue', sans-serif;
      font-weight: 200;
      font-size: clamp(9px, 1.1vw, 11px);
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      color: rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeInSlow 2s ease 2s forwards;
    }

    /* Contact footer */
    .footer {
      position: fixed;
      bottom: 44px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      opacity: 0;
      animation: fadeInSlow 1.5s ease 2.8s forwards;
    }

    .footer a {
      font-family: 'Barlow', 'Helvetica Neue', sans-serif;
      font-weight: 200;
      font-size: 10px;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      color: rgba(255, 255, 255, 0.2);
      text-decoration: none;
      text-transform: uppercase;
      cursor: none;
      transition: color 0.5s ease;
    }
    .footer a:hover {
      color: rgba(255, 255, 255, 0.55);
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 1s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    .loader-dot {
      width: 3px; height: 3px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    /* Animations */
    @keyframes revealBrand {
      from { opacity: 0; transform: translateY(16px); filter: blur(12px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0);    }
    }
    @keyframes fadeInSlow {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50%       { opacity: 0.7;  transform: scale(1.3); }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="loader-dot"></div>
  </div>

  <div id="cursor"></div>

  <canvas id="webgl"></canvas>

  <div class="vignette"></div>
  <div class="corner-line"></div>
  <div class="corner-line-br"></div>

  <div class="overlay">
    <div class="brand">FASIC</div>
    <div class="tagline">Gaming Peripherals &nbsp;&mdash;&nbsp; Coming Soon</div>
  </div>

  <div class="footer">
    <a href="mailto:hello@fasic.com" class="link-hover">hello@fasic.com</a>
  </div>

  <!-- Custom cursor interaction -->
  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="js/scene.js"></script>
</body>
</html>
