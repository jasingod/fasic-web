<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FASIC — A new era of gaming peripherals. Coming soon." />
  <meta property="og:title" content="FASIC" />
  <meta property="og:description" content="Something is coming." />
  <title>FASIC</title>

  <!-- Inter — SIL Open Font License, free for commercial use -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #050505;
      cursor: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ── Cursor ─────────────────────────────────────────────── */
    #cursor {
      position: fixed; width: 5px; height: 5px;
      background: rgba(255,255,255,0.5); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, background 0.3s ease;
    }
    #cursor.hover {
      transform: translate(-50%, -50%) scale(3.5);
      background: rgba(255,255,255,0.12);
    }

    /* ── Vignette ───────────────────────────────────────────── */
    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 55%, transparent 30%, rgba(0,0,0,0.6) 100%);
      pointer-events: none; z-index: 1;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 36px 48px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 20; pointer-events: none;
      opacity: 0; animation: fadeIn 0.6s ease 0.8s forwards;
    }
    .logo-mark {
      pointer-events: all;
      display: flex; align-items: center; gap: 14px;
      opacity: 0.7; transition: opacity 0.4s ease;
    }
    .logo-mark:hover { opacity: 1; }
    .logo-name {
      font-weight: 300; font-size: 11px;
      letter-spacing: 0.42em; text-indent: 0.42em;
      color: rgba(255,255,255,0.6); text-transform: uppercase;
    }
    .contact-btn {
      pointer-events: all; background: none;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.45);
      font-family: inherit; font-weight: 300; font-size: 9px;
      letter-spacing: 0.45em; text-indent: 0.45em;
      padding: 11px 22px; text-transform: uppercase;
      cursor: none; transition: border-color 0.35s, color 0.35s;
    }
    .contact-btn:hover {
      border-color: rgba(255,255,255,0.48);
      color: rgba(255,255,255,0.88);
    }

    /* ── Corner accents ─────────────────────────────────────── */
    .corner { position: fixed; z-index: 10; opacity: 0; animation: fadeIn 0.6s ease 1.0s forwards; }
    .corner-tl { top: 44px; left: 44px; }
    .corner-br { bottom: 44px; right: 44px; }
    .corner-tl::before,.corner-tl::after,
    .corner-br::before,.corner-br::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.13);
    }
    .corner-tl::before { width: 28px; height: 1px; top: 0; left: 0; }
    .corner-tl::after  { width: 1px; height: 28px; top: -14px; left: 0; }
    .corner-br::before { width: 28px; height: 1px; bottom: 0; right: 0; }
    .corner-br::after  { width: 1px; height: 28px; bottom: -14px; right: 0; }

    /* ── Brand overlay ──────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; pointer-events: none;
    }
    .brand {
      font-weight: 100;
      font-size: clamp(64px, 11.5vw, 152px);
      letter-spacing: 0.54em; text-indent: 0.54em;
      color: rgba(255,255,255,0.95);
      user-select: none; opacity: 0;
      animation: revealBrand 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }
    .tagline {
      margin-top: 20px; font-weight: 300;
      font-size: clamp(9px, 1.05vw, 11px);
      letter-spacing: 0.48em; text-indent: 0.48em;
      color: rgba(255,255,255,0.2); text-transform: uppercase;
      opacity: 0; animation: fadeIn 0.6s ease 0.7s forwards;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      position: fixed; bottom: 40px; left: 0; right: 0;
      text-align: center; z-index: 10;
      opacity: 0; animation: fadeIn 0.6s ease 1.0s forwards;
    }
    footer a {
      font-weight: 300; font-size: 10px;
      letter-spacing: 0.36em; text-indent: 0.36em;
      color: rgba(255,255,255,0.2); text-decoration: none;
      text-transform: uppercase; cursor: none;
      transition: color 0.4s ease; font-family: inherit;
    }
    footer a:hover { color: rgba(255,255,255,0.55); }

    /* ── Contact Modal ───────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(2,2,4,0.92);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      z-index: 300; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.45s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal-box {
      width: min(540px, 90vw); padding: 58px 54px 52px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(6,6,8,0.98); position: relative;
      transform: translateY(22px);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal-overlay.open .modal-box { transform: translateY(0); }

    .modal-close {
      position: absolute; top: 24px; right: 24px;
      width: 32px; height: 32px; background: none; border: none;
      cursor: none; display: flex; align-items: center; justify-content: center;
      opacity: 0.3; transition: opacity 0.3s ease;
    }
    .modal-close:hover { opacity: 0.9; }

    .modal-eyebrow {
      font-weight: 300; font-size: 9px; letter-spacing: 0.5em; text-indent: 0.5em;
      color: rgba(255,255,255,0.28); text-transform: uppercase; margin-bottom: 16px;
    }
    .modal-title {
      font-weight: 200; font-size: 28px;
      letter-spacing: 0.18em; text-indent: 0.18em;
      color: rgba(255,255,255,0.88); margin-bottom: 44px;
    }

    .form-group { margin-bottom: 32px; }
    .form-group label {
      display: block; font-weight: 300; font-size: 9px;
      letter-spacing: 0.42em; text-indent: 0.42em;
      color: rgba(255,255,255,0.28); text-transform: uppercase; margin-bottom: 12px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.82); font-family: inherit;
      font-weight: 300; font-size: 14px; letter-spacing: 0.04em;
      padding: 10px 0; outline: none; transition: border-color 0.3s ease;
      -webkit-appearance: none; appearance: none; border-radius: 0;
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: rgba(255,255,255,0.15); }
    .form-group input:focus,
    .form-group textarea:focus { border-bottom-color: rgba(255,255,255,0.42); }
    .form-group textarea { resize: none; height: 110px; }

    .submit-btn {
      margin-top: 8px; width: 100%; padding: 17px;
      background: rgba(255,255,255,0.88); color: #050505;
      border: none; font-family: inherit; font-weight: 400;
      font-size: 10px; letter-spacing: 0.48em; text-indent: 0.48em;
      text-transform: uppercase; cursor: none;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .submit-btn:hover { background: #fff; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.4; }

    .privacy-note {
      margin-top: 20px; font-weight: 300; font-size: 10px;
      letter-spacing: 0.06em; color: rgba(255,255,255,0.18);
      text-align: center; line-height: 1.7;
    }
    .form-success {
      display: none; text-align: center; padding: 20px 0;
    }
    .form-success .success-icon {
      width: 32px; height: 32px; margin: 0 auto 20px;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .form-success p {
      font-weight: 300; font-size: 13px;
      letter-spacing: 0.08em; color: rgba(255,255,255,0.55); line-height: 1.9;
    }

    /* ── Keyframes ───────────────────────────────────────────── */
    @keyframes revealBrand {
      from { opacity: 0; transform: translateY(14px); filter: blur(10px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div id="cursor"></div>
  <div class="vignette"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-br"></div>

  <header>
    <div class="logo-mark">
      <svg width="26" height="38" viewBox="0 0 36 52" fill="none">
        <rect x="3" y="3" width="30" height="46" rx="15"
              stroke="rgba(255,255,255,0.82)" stroke-width="4.5" fill="none"/>
        <circle cx="18" cy="17" r="4.5" fill="rgba(255,255,255,0.82)"/>
      </svg>
      <span class="logo-name">FASIC</span>
    </div>
    <button class="contact-btn" id="open-modal">Contact</button>
  </header>

  <div class="overlay">
    <div class="brand">FASIC</div>
    <div class="tagline">Gaming Peripherals &nbsp;&mdash;&nbsp; Coming Soon</div>
  </div>

  <footer>
    <a href="mailto:master@fasic.pro">master@fasic.pro</a>
  </footer>

  <!-- Contact Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" id="close-modal" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
             stroke="white" stroke-width="1.5">
          <line x1="1" y1="1" x2="13" y2="13"/>
          <line x1="13" y1="1" x2="1"  y2="13"/>
        </svg>
      </button>

      <div id="form-wrap">
        <p class="modal-eyebrow">Business Inquiry</p>
        <h2 class="modal-title">Get in Touch</h2>

        <form id="contact-form" action="https://formspree.io/f/mwvzqkpa" method="POST">
          <input type="hidden" name="_subject" value="FASIC Business Inquiry" />

          <div class="form-group">
            <label for="f-name">Name</label>
            <input id="f-name" type="text" name="name" required placeholder="Your name" />
          </div>
          <div class="form-group">
            <label for="f-contact">Contact</label>
            <input id="f-contact" type="text" name="contact" required
                   placeholder="Email or phone number" />
          </div>
          <div class="form-group">
            <label for="f-msg">Message</label>
            <textarea id="f-msg" name="message" required
                      placeholder="Tell us about your inquiry"></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">Send</button>
        </form>

        <p class="privacy-note">All inquiries are handled privately.<br>
          We'll get back to you directly.</p>
      </div>

      <div class="form-success" id="form-success">
        <div class="success-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
               stroke="rgba(255,255,255,0.7)" stroke-width="1.5">
            <polyline points="2,7 6,11 12,3"/>
          </svg>
        </div>
        <p>Message received.<br>We'll be in touch soon.</p>
      </div>
    </div>
  </div>

  <script>
    // Cursor
    const cur = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cur.style.left = e.clientX + 'px';
      cur.style.top  = e.clientY + 'px';
    });
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => cur.classList.add('hover'));
      el.addEventListener('mouseleave', () => cur.classList.remove('hover'));
    });

    // Modal
    const overlay = document.getElementById('modal-overlay');
    document.getElementById('open-modal').addEventListener('click',
      () => overlay.classList.add('open'));
    document.getElementById('close-modal').addEventListener('click',
      () => overlay.classList.remove('open'));
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('open');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') overlay.classList.remove('open');
    });

    // Form submit
    const form      = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      try {
        const res = await fetch(form.action, {
          method: 'POST', body: new FormData(form),
          headers: { Accept: 'application/json' },
        });
        if (res.ok) {
          document.getElementById('form-wrap').style.display = 'none';
          document.getElementById('form-success').style.display = 'block';
          form.reset();
        } else { throw new Error(); }
      } catch {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Please try again';
      }
    });
  </script>
</body>
</html>
